name: Build Windows Flutter client

on:
  push:
    branches: [main, 'feature-windows-client']
    paths:
      - 'desktop-windows-flutter/**'
      - 'desktop-mac/backend/**'
      - 'kotlin-tv/core/**'
      - 'scripts/build-windows-flutter.ps1'
      - '.github/workflows/desktop-windows-flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop-windows-flutter/**'
      - 'desktop-mac/backend/**'
      - 'kotlin-tv/core/**'
      - 'scripts/build-windows-flutter.ps1'
      - '.github/workflows/desktop-windows-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Flutter + media_kit (libmpv) + a jlink JRE; no VLC download is involved.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      # :core:test has a Windows-only failure in AppUpdatesTest (verified download rename,
      # tracked separately), so CI only gates on the Flutter client's own checks.
      - name: Analyze and test
        shell: pwsh
        working-directory: desktop-windows-flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build portable ZIP
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -File scripts\build-windows-flutter.ps1
      # The script mirrors Gradle/Flutter/jlink output into build.log. Annotations are the only
      # CI output readable without repository authentication, so surface the tail as errors.
      - name: Report build failure
        if: failure()
        shell: pwsh
        run: |
          $log = 'outputs/windows-flutter/build.log'
          if (-not (Test-Path $log)) { Write-Host '::error::build.log was not produced'; exit 0 }
          $lines = Get-Content $log
          $interesting = $lines | Where-Object { $_ -match '(?i)error|failed|exception|cannot|not found|denied' } | Select-Object -Last 8
          if (-not $interesting) { $interesting = $lines | Select-Object -Last 8 }
          $count = 0
          foreach ($line in $interesting) {
            if ($count -ge 9) { break }
            Write-Host "::error::$line"
            $count++
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-flutter-build-log
          path: outputs/windows-flutter/build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path desktop-windows-flutter\pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $line) { throw 'No version line in desktop-windows-flutter/pubspec.yaml.' }
          "version=$($line.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
      - name: Report artifact sizes
        shell: pwsh
        run: |
          $zip = Get-ChildItem outputs\windows-flutter\*.zip | Select-Object -First 1
          if (-not $zip) { throw 'The portable ZIP was not produced.' }
          Write-Host ("Archive: {0} ({1} MB)" -f $zip.FullName, [math]::Round($zip.Length / 1MB, 1))
          $app = 'outputs\windows-flutter\GuoyingTV'
          Get-ChildItem $app -Directory |
            ForEach-Object { [pscustomobject]@{ Folder = $_.Name; MB = [math]::Round(((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1) } } |
            Sort-Object MB -Descending |
            Format-Table -AutoSize |
            Out-String |
            Write-Host
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guoyingtv-windows-flutter-x64-${{ steps.version.outputs.version }}
          path: outputs/windows-flutter/*.zip
          if-no-files-found: error
          retention-days: 14
          # The artifact service always zips again; storing the ZIP as-is avoids a slow second pass.
          compression-level: 0
